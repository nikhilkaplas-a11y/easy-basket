name: easy_basket
description: Easy Basket - Instant Grocery Delivery App
publish_to: 'none'
version: 10.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Forms & Validation (optional - not currently used, can be added later)
  # flutter_form_builder: ^9.1.1
  # form_builder_validators: ^9.1.0
  
  # Payments
  razorpay_flutter: ^1.3.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Maps
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.0.1
  
  # Image Handling
  image_picker: ^1.0.7
  image: ^4.1.3
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  google_fonts: ^8.0.2
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  # fonts:
  #   - family: RoundedSans
  #     fonts:
  #       - asset: assets/fonts/RoundedSans-Regular.ttf
  #       - asset: assets/fonts/RoundedSans-Bold.ttf
  #         weight: 700
  # Note: Uncomment above and add font files if you have RoundedSans font

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
