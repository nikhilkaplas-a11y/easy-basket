# Build on GitHub (large heap). Production server can use npm run build on t3.small.
name: Backend build

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build:large

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          if-no-files-found: error

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-bundle
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
