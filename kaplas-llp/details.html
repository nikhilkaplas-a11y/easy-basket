<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Kaplas Academy
</title>

<link rel="stylesheet" href="css/main.css">

<script src="js/details.js" defer></script>

<style>

.details-page{

padding:140px 5% 100px;

min-height:100vh;

}

.details-container{

max-width:1300px;

margin:auto;

display:grid;

grid-template-columns:
1fr 1fr;

gap:60px;

align-items:center;

}

.details-image{

overflow:hidden;

border-radius:28px;

border:1px solid var(--border);

}

.details-image img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}

.details-content h1{

font-size:clamp(2.8rem,5vw,4.5rem);

margin-top:20px;

}

.details-content p{

margin-top:24px;

line-height:1.9;

font-size:1.05rem;

color:var(--text-muted);

}

.details-price{

display:flex;

gap:18px;

align-items:center;

margin-top:30px;

}

.old-price{

text-decoration:line-through;

font-size:22px;

color:var(--text-dim);

}

.new-price{

font-size:42px;

font-weight:700;

background:
linear-gradient(
135deg,
#818cf8,
#06B6D4
);

-webkit-background-clip:text;

color:transparent;

}

.details-meta{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

margin-top:35px;

}

.meta-box{

padding:22px;

border-radius:18px;

border:1px solid var(--border);

background:
rgba(255,255,255,.03);

}

.meta-label{

font-size:.75rem;

text-transform:uppercase;

letter-spacing:.14em;

color:var(--text-dim);

}

.meta-value{

margin-top:10px;

font-size:1.1rem;

font-weight:600;

display:flex;

align-items:center;

gap:10px;

}

.live-dot{

width:12px;

height:12px;

border-radius:50%;

background:#00ff66;

box-shadow:
0 0 12px #00ff66;

}

.modules{

margin-top:40px;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:18px;

}

.module{

padding:18px;

border-radius:16px;

border:1px solid var(--border);

background:
linear-gradient(
135deg,
rgba(255,255,255,0.04),
transparent
);

font-weight:500;

transition:.3s;

}

.module:hover{

transform:translateY(-5px);

border-color:
rgba(79,70,229,.4);

}

.hero-btns{

display:flex;

gap:18px;

margin-top:45px;

flex-wrap:wrap;

}

.apply-btn{

padding:15px 30px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
#4F46E5,
#06B6D4
);

color:white;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.apply-btn:hover{

transform:translateY(-3px);

box-shadow:
0 15px 35px
rgba(79,70,229,.35);

}

.back-btn{

padding:15px 30px;

border-radius:14px;

border:1px solid var(--border);

background:
rgba(255,255,255,.04);

color:white;

font-weight:600;

}

@media(max-width:950px){

.details-container{

grid-template-columns:1fr;

}

.modules{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<section class="details-page">

<div class="details-container">

<div class="details-image">

<img
id="course-image"
src=""
alt=""
>

</div>


<div class="details-content">

<span class="eyebrow">
KAPLAS ACADEMY
</span>

<h1 id="title"></h1>

<p id="description"></p>

<div class="details-price">

<span
class="old-price"
id="oldPrice"
></span>

<span
class="new-price"
id="newPrice"
></span>

</div>


<div class="details-meta">

<div class="meta-box">

<div class="meta-label">
Duration
</div>

<div
class="meta-value"
id="duration"
></div>

</div>


<div class="meta-box">

<div class="meta-label">
Status
</div>

<div class="meta-value">

<div class="live-dot">
</div>

<span id="status"></span>

</div>

</div>

</div>


<div
class="modules"
id="modules"
>

</div>


<div class="hero-btns">
<!-- re-direct to apply -->
<a href="index.html#contact" class="btn btn-primary btn-lg btn-arrow btn-magnetic">Apply Now
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>

<a href="training.html">

<button class="back-btn">
Back
</button>

</a>

</div>

</div>

</div>

</section>



<script>

const params =
new URLSearchParams(
window.location.search
);

const course =
params.get("course");

const item =
data[course];



if(!item){

document.body.innerHTML = `

<h1
style="
color:white;
text-align:center;
margin-top:100px;
font-size:50px;
"
>

Course Not Found

</h1>

`;

throw new Error(
"Invalid Course"
);

}



document.getElementById(
"title"
).innerText =
item.title;

document.getElementById(
"description"
).innerText =
item.description;

document.getElementById(
"oldPrice"
).innerText =
item.oldPrice;

document.getElementById(
"newPrice"
).innerText =
item.newPrice;

document.getElementById(
"duration"
).innerText =
item.duration;

document.getElementById(
"status"
).innerText =
item.status;

document.getElementById(
"course-image"
).src =
item.image;



document.getElementById(
"modules"
).innerHTML =

item.modules.map(
m=>`

<div class="module">
${m}
</div>

`
).join("");

</script>

</body>

</html>
