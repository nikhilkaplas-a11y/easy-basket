<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaplas Academy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#070B17;color:#fff}
.hero{max-width:1300px;margin:80px auto 40px;padding:0 5%;
display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:center}
.badge{background:#4F46E5;padding:8px 16px;border-radius:30px;font-size:.8rem;display:inline-block}
.hero-left h1{font-size:clamp(2.5rem,5vw,4.5rem);margin:20px 0}
.hero-left p{color:#CBD5E1;line-height:1.8}
.hero-right{border-radius:25px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.hero-right img{width:100%;display:block}
.container{max-width:1300px;margin:auto;padding:20px 5%;display:grid;grid-template-columns:2fr 1fr;gap:35px}
.card,.price-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);padding:30px;border-radius:25px;margin-bottom:25px}
.modules,.features{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.module,.feature{padding:18px;background:rgba(255,255,255,.04);border-radius:15px}
.module:hover{border:1px solid #4F46E5}
.sidebar{position:sticky;top:20px;height:fit-content}
.old-price{text-decoration:line-through;color:#94A3B8}
.new-price{font-size:3rem;font-weight:700;background:linear-gradient(135deg,#4F46E5,#06B6D4);
-webkit-background-clip:text;color:transparent}
.btn{display:block;text-align:center;padding:15px;border-radius:15px;text-decoration:none;
margin-top:15px;font-weight:600}
.primary{background:linear-gradient(135deg,#4F46E5,#06B6D4);color:#fff}
.secondary{background:#1E293B;color:#fff}
@media(max-width:900px){
.hero,.container{grid-template-columns:1fr}
.modules,.features{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section class="hero">
<div class="hero-left">
<span class="badge">KAPLAS ACADEMY</span>
<h1 id="title"></h1>
<p id="description"></p>
<a href="index.html#contact" class="btn primary">Apply Now</a>
</div>
<div class="hero-right">
<img id="course-image" src="" alt="Course">
</div>
</section>

<div class="container">
<div>
<div class="card">
<h2>Course Overview</h2>
<p id="overview"></p>
</div>

<div class="card">
<h2>Curriculum</h2>
<div id="modules" class="modules"></div>
</div>

<div class="card">
<h2>Why Join Us?</h2>
<div class="features">
<div class="feature">✅ Live Classes</div>
<div class="feature">✅ Recorded Sessions</div>
<div class="feature">✅ Placement Guidance</div>
<div class="feature">✅ Real Projects</div>
<div class="feature">✅ Mock Interviews</div>
<div class="feature">✅ Industry Mentorship</div>
</div>
</div>
</div>

<div class="sidebar">
<div class="price-card">
<h3>Course Price</h3><br>
<div id="oldPrice" class="old-price"></div>
<div id="newPrice" class="new-price"></div><br>
<p><b>Duration:</b> <span id="duration"></span></p><br>
<p><b>Status:</b> <span id="status"></span></p>
<a href="index.html#contact" class="btn primary">Apply Now</a>
<a href="training.html" class="btn secondary">Back</a>
</div>
</div>
</div>

<script>
const data={
dsa:{title:"DSA Mastery Program",description:"Master Data Structures and Algorithms.",oldPrice:"₹5499",newPrice:"₹4499",duration:"2 Months",status:"LIVE",image:"assets/DSA.png",modules:["Arrays","Linked Lists","Trees","Graphs","Dynamic Programming","Recursion","Greedy","Interview Prep"]},
systemdesign:{title:"System Design Program",description:"Learn scalable system architecture.",oldPrice:"₹5499",newPrice:"₹4499",duration:"2 Months",status:"LIVE",image:"assets/system-design.png",modules:["HLD","LLD","Redis","Kafka","CDN","API Design","Microservices","Load Balancing","AWS EC2","Architectural Patterns"]},
ai:{title:"Artificial Intelligence Program",description:"Learn AI, ML and Generative AI.",oldPrice:"₹5499",newPrice:"₹4499",duration:"2 Months",status:"LIVE",image:"assets/ai.png",modules:[
"Python for AI",
"Data Processing",
"Machine Learning",
"Neural Networks",
"Deep Learning",
"Generative AI",
"Prompt Engineering",
"Agentic AI",
"AI Models & LLMs",
"Real-World AI Projects"
]},
mastery:{
title:"DSA + System Design + AI",
description:"Complete technology mastery program combining DSA, System Design, and Artificial Intelligence into one powerful roadmap. This intensive program prepares students for placements, internships, software engineering interviews, and modern AI workflows.",
oldPrice:"₹16499",
newPrice:"₹8499",
duration:"5-6 Months",
status:"LIVE",
image:"assets/combo.png",
modules:[
"Advanced DSA",
"System Design",
"Artificial Intelligence",
"Projects",
"Interview Preparation",
"Problem Solving",
"Production Concepts",
"Placement Guidance"
]
},
software: {
        title: "Software / Web Development Internship",
        description: "Gain real-world experience by building frontend, backend, and full-stack applications under industry mentorship.",
        oldPrice: "",
        newPrice: "₹6000",
        duration: "6 Months",
        status: "OPEN",
        image: "assets/software-dev-intern.png",
        modules: [
            "Frontend Development",
            "Backend Development",
            "REST APIs",
            "Database Design",
            "Git & GitHub",
            "Deployment",
            "Industry Workflow",
            "Real Projects"
        ]
    },

    aiml: {
        title: "AI / ML Internship",
        description: "Work on real AI and Machine Learning projects involving predictive models, neural networks, data analysis, and deep learning.",
        oldPrice: "",
        newPrice: "₹6000",
        duration: "6 Months",
        status: "OPEN",
        image: "assets/aiml-intern.png",
        modules: [
            "Machine Learning",
            "Predictive Models",
            "Data Analysis",
            "AI Algorithms",
            "Dataset Training",
            "Deep Learning",
            "Python for AI",
            "Industry Projects"
        ]
    }      
};

const params=new URLSearchParams(window.location.search);
const course=params.get("course")||"dsa";
const item=data[course];

if(!item){window.location.href="details.html?course=dsa";}

document.getElementById("title").innerText=item.title;
document.getElementById("description").innerText=item.description;
document.getElementById("overview").innerText=item.description;
document.getElementById("oldPrice").innerText=item.oldPrice;
document.getElementById("newPrice").innerText=item.newPrice;
document.getElementById("duration").innerText=item.duration;
document.getElementById("status").innerText=item.status;
document.getElementById("course-image").src=item.image;
document.getElementById("modules").innerHTML=item.modules.map(m=>`<div class="module">${m}</div>`).join("");
</script>
</body>
</html>
